apiVersion: apps/v1
kind: Deployment
metadata:
  name: itemsapi-app
  namespace: itemsapi-test
  labels:
    app: itemsapi
    environment: test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: itemsapi
  template:
    metadata:
      labels:
        app: itemsapi
        environment: test
    spec:
      containers:
      - name: fastapi-app
        image: raghavkabra7/itemsapi:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DATABASE_URL
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: itemsapi-service
  namespace: itemsapi-test
  labels:
    app: itemsapi
spec:
  type: LoadBalancer  # Change to NodePort for local testing or ClusterIP for internal only
  selector:
    app: itemsapi
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: itemsapi-hpa
  namespace: itemsapi-test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: itemsapi-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
